# Benchmark Regression Gate — GitHub Actions
#
# Builds and benchmarks BOTH the PR head and the PR's merge base on the SAME
# runner in the SAME job, then fails if head is slower by more than the
# per-metric threshold in scripts/check_benchmark_regression.py (P50 +10%,
# P99 +25% — see that file for how those numbers were measured).
#
# There is deliberately no stored baseline.json. The previous version of this
# gate compared against `benchmarks/baseline.json`, a file that was never
# committed and that nothing wrote — the missing-baseline branch just printed
# "No baseline found" and passed, so the gate had never once compared anything.
# A committed baseline would not have fixed it either: Release builds use
# -march=native and GitHub's runner pool is heterogeneous, so a stored number is
# measured on different silicon than the run it gates. Building both sides on one
# runner removes the baseline file, the staleness, and the cross-machine variance
# in one move.
#
# The gate is BLOCKING. If it cannot make a comparison it fails. Do not add
# continue-on-error, and do not make a missing measurement pass — a gate that
# cannot fail is the bug this workflow was rewritten to fix.

name: Benchmark Regression Gate

on:
  pull_request:
    branches: [main, develop]
    # Deliberately NO paths: filter. This gate is a required status check, and
    # GitHub does not synthesize a success for a path-filtered workflow that
    # never triggers — the check would sit at "Expected — Waiting for status to
    # be reported" forever and block the PR just as hard as a failure would. A
    # doc-only PR being unmergeable is the same footgun as a gate that cannot
    # fail, pointed the other way.
    #
    # The companion-job workaround does not fit here either: paths: filters the
    # whole workflow, so a skip job in this file would be skipped with it, and
    # splitting it into a second file with paths-ignore: is not the exact
    # complement — a PR touching both src/ and docs/ would match both files and
    # report two checks named "benchmark", one of them trivially green.
    #
    # So the job always runs, always reports, and decides for itself whether
    # there is anything to benchmark (see "Detect relevant changes"). The cost
    # on an irrelevant PR is one runner spin-up and a git diff.

concurrency:
  group: benchmark-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # This job configures and builds CMake and C++ from the PR head — code the
    # PR author controls executes here at configure time. It must not hold a
    # writable token while doing that.
    permissions:
      contents: read
    # Two Release builds of the benchmark target. The benchmark runs themselves
    # are <1s each; the budget is almost entirely compilation.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge base is resolvable for the A/B build.
          # fetch-depth: 0 populates every origin/* ref up front, so no later
          # step needs the network — which is what lets the token be dropped
          # from .git/config instead of left where a PR-authored CMakeLists.txt
          # could read it at configure time.
          fetch-depth: 0
          persist-credentials: false

      # Resolves the merge base, materializes it at /tmp/base, and decides
      # whether this PR touches anything the benchmark can speak to. Everything
      # after this is conditional on that answer; this step itself always runs,
      # which is what keeps the "benchmark" check reporting on every PR.
      - name: Detect relevant changes and materialize the merge base
        id: changes
        run: |
          set -euo pipefail

          # No git fetch here: checkout ran with fetch-depth: 0, so
          # origin/${GITHUB_BASE_REF} is already local. Keep it that way — the
          # checkout step drops the token, so a fetch at this point would fail on
          # a private repo rather than fall back to anything.
          BASE_SHA=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")
          echo "PR head:    $(git rev-parse HEAD)"
          echo "merge base: ${BASE_SHA}"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

          # The paths that can move a latency number, or that change how it is
          # judged. Kept here rather than in an `on: paths:` filter so that a
          # non-match still produces a green check instead of no check at all.
          if git diff --name-only "${BASE_SHA}" HEAD | grep -qE \
               '^(src/|include/|benchmarks/|CMakeLists\.txt$|scripts/check_benchmark_regression\.py$|\.github/workflows/benchmark-gate\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Benchmark-relevant paths changed; running the full A/B."
            git worktree add /tmp/base "${BASE_SHA}"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No benchmark-relevant paths changed; nothing to compare."
          fi

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13

      - name: Verify the comparator itself
        if: steps.changes.outputs.relevant == 'true'
        # The gate's own logic is the thing most likely to rot into a no-op
        # again, so its assertions run before it is trusted to judge anything.
        #
        # The merge base's copy runs FIRST and is the real anchor: a PR that
        # weakens the gate also ships the weakened assertions, so running only
        # the PR's own selftest is self-referential and proves nothing. The
        # merge-base copy comes from a commit this PR does not control.
        # .github/CODEOWNERS covers the remaining case below, where the merge
        # base has no comparator yet.
        run: |
          set -euo pipefail
          if [ -f /tmp/base/scripts/check_benchmark_regression.py ]; then
            echo "--- merge-base selftest (anchor: assertions this PR cannot edit) ---"
            python3 /tmp/base/scripts/check_benchmark_regression.py --selftest
          else
            echo "--- merge base has no comparator; CODEOWNERS review is the only anchor ---"
          fi
          echo "--- PR selftest (validates logic this PR adds) ---"
          python3 scripts/check_benchmark_regression.py --selftest

      - name: Benchmark PR head and merge base
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail

          mkdir -p results

          # $1 = source tree, $2 = label. Identical flags and identical order
          # flow on both sides; the only difference is the code under test.
          bench() {
            cmake -S "$1" -B "$1/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-13 \
              -DBUILD_TESTS=OFF \
              -DBUILD_BENCHMARKS=ON \
              -DBUILD_TOOLS=OFF \
              -DENABLE_LTO=OFF
            cmake --build "$1/build" --target DeterministicBenchmark -j"$(nproc)"
            # Five runs; the comparator takes the minimum of each side to shed
            # co-tenant scheduler noise. Each run is well under a second.
            for run in 1 2 3 4 5; do
              "$1/build/benchmarks/DeterministicBenchmark" \
                --seed 42 --iterations 20 --orders 5000 \
                --output "results/$2-${run}.json"
            done
          }

          # Head first, so a PR that does not build fails before spending time
          # on the base tree.
          bench "${GITHUB_WORKSPACE}" head
          bench /tmp/base base

          # Both sides must have produced exactly five files. The binary now
          # exits non-zero if it cannot write its JSON, but assert the count
          # anyway: a partial run that dropped two files on one side would
          # otherwise silently shrink the set that side's minimum is taken over,
          # biasing it slower with no warning anywhere in the log.
          for side in head base; do
            found=$(find results -maxdepth 1 -name "${side}-*.json" | wc -l)
            if [ "${found}" -ne 5 ]; then
              echo "Expected 5 ${side} result files, found ${found}."
              echo "A benchmark run failed to write its JSON; the comparison" \
                   "would be taken over an incomplete sample set."
              exit 1
            fi
          done
          echo "Result files: 5 head, 5 base."

      - name: Compare head against merge base
        if: steps.changes.outputs.relevant == 'true'
        # Thresholds are per-metric and live in the script (p50 +10%, p99 +25%),
        # derived from a measured noise floor. Do NOT add --threshold here: it
        # overrides every metric with one value, which would either flake p99 or
        # blunt p50.
        #
        # Both comparators run against the same results. The PR's copy applies
        # any check this PR adds; the merge base's copy applies thresholds and
        # guards the PR cannot edit. Either one failing fails the build.
        run: |
          set -euo pipefail
          echo "--- PR comparator ---"
          python3 scripts/check_benchmark_regression.py \
            --base results/base-*.json \
            --head results/head-*.json
          if [ -f /tmp/base/scripts/check_benchmark_regression.py ]; then
            echo "--- merge-base comparator (thresholds this PR cannot edit) ---"
            python3 /tmp/base/scripts/check_benchmark_regression.py \
              --base results/base-*.json \
              --head results/head-*.json
          fi

      - name: Upload benchmark results
        # always(), so a failed comparison still uploads the numbers that caused
        # it — but only when there were runs to upload at all.
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/

      - name: Run Sustained Load Test (smoke)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          cmake --build build --target SustainedLoadTest -j"$(nproc)"
          build/benchmarks/SustainedLoadTest \
            --duration 5 --rate 100000 --threads 2 --symbols 4 \
            --p99-threshold 50000

      - name: No benchmark-relevant changes
        if: steps.changes.outputs.relevant != 'true'
        # The reporting half of the no-paths-filter decision at the top of this
        # file. This PR touched nothing that can move a latency number, so the
        # required "benchmark" check passes here instead of never arriving.
        run: echo "Skipped — no benchmark-relevant paths changed."
