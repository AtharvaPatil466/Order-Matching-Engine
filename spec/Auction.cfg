\* TLC config for Auction.tla, run by .github/workflows/tla.yml on every
\* push. Counts from the last run are in docs/Verification.md.
\*
\* Six state changes are enough to boot, open a dated session through its
\* opening auction, close it and begin the next date's PreOpen, or to reach
\* every edge of the table (each is reached in some behaviour at these
\* bounds; see docs/Verification.md).

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxEvents = 6
    MaxDate   = 2
    Prices    = {100, 200}
    BUG       = "none"

INVARIANTS
    TypeOK
    NoMatchOutsideContinuousExceptUncross
    SingleClearingPrice
    NoTradeWhileHalted

PROPERTIES
    ValidTransitions
    VolatilityEventuallyReopens
