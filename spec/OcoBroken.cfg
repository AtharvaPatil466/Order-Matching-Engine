\* TLC config for Oco.tla — the BUG-INJECTED engine (BROKEN_NO_OCO_CANCEL = TRUE).
\*
\* Same bounded model as Oco.cfg, but Execute(o) only flips o to Executed
\* and does NOT cancel its Live siblings. TLC must then find a reachable
\* state where two legs of the same OCO group are both Executed, i.e. a
\* counterexample to AtMostOneWinnerPerGroup. This non-vacuity check proves
\* the invariant actually constrains the model (it has teeth).
\*
\* Expected result: TLC reports an invariant violation for
\* AtMostOneWinnerPerGroup with a short error trace (Init -> Execute(oi)
\* -> Execute(oj) for two siblings oi, oj of the same group).
\*
\* We check ONLY the structural invariants plus AtMostOneWinnerPerGroup
\* here. The bug also violates WinnerSilencesSiblings one step earlier
\* (a winner coexisting with a Live sibling), so listing it would make TLC
\* stop on that invariant first. Omitting it pins the counterexample to the
\* intended "two legs both Executed" violation of AtMostOneWinnerPerGroup.
\* (Oco.cfg verifies WinnerSilencesSiblings holds for the CORRECT engine.)

SPECIFICATION Spec

CONSTANTS
    Orders = {o1, o2, o3, o4, o5, o6}
    Groups = {{o1, o2}, {o3, o4, o5}}
    BROKEN_NO_OCO_CANCEL = TRUE

INVARIANTS
    TypeOK
    ValidStates
    AtMostOneWinnerPerGroup
