\* Non-vacuity cfg for MatchingEngine.tla: BUG = "worst_price_first" (Match takes the worst level the aggressor crosses).
\* TLC must report a PricePriority counterexample; .github/workflows/tla.yml fails the
\* build if it passes or fails for any other reason. Bounds as MatchingEngine.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "worst_price_first"

PROPERTIES
    PricePriority
