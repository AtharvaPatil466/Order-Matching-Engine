\* Higher-bound rerun of MatchingEngine.tla (reviewer request): MaxOrders bumped
\* from 3 to 4. This admits up to 3 resting orders on one side at a single price
\* level (place 3, cross with a 4th) — the regime where FIFO time-priority bugs
\* manifest (the 3rd+ order at a level is where insertion/removal can break the
\* timestamp ordering). MaxOrders=5 was tried and is intractable on commodity
\* hardware (>228M distinct states with >200M still queued after ~20 min, no
\* convergence). 4 is the largest bound that exhausts here. Other constants match
\* MatchingEngine.cfg. BROKEN_NO_FIFO = FALSE (real spec).
SPECIFICATION Spec

CONSTANTS
    MaxOrders = 4
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    MaxTime = 2
    BROKEN_NO_FIFO = FALSE

INVARIANTS
    NoNegativeQuantity
    FIFO_Preservation
    MatchingConservation
    FIFOExecution
    GTD_Expiry_Correctness
