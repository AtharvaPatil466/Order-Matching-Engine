\* Non-vacuity cfg for MatchingEngine.tla: BUG = "modify_to_zero" (Modify accepts 0 and leaves the order resting, MATCH-2).
\* TLC must report a NoEmptyRestingOrder counterexample; .github/workflows/tla.yml fails the
\* build if it passes or fails for any other reason. Bounds as MatchingEngine.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "modify_to_zero"

INVARIANTS
    NoEmptyRestingOrder
