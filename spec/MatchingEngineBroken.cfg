\* Non-vacuity cfg for MatchingEngine.tla: BUG = "no_fifo" (Match takes the youngest order at the level).
\* TLC must report a FIFOExecution counterexample; .github/workflows/tla.yml fails the
\* build if it passes or fails for any other reason. Bounds as MatchingEngine.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "no_fifo"

PROPERTIES
    FIFOExecution
