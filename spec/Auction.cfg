\* TLC config for Auction.tla — the exchange auction / session state machine.
\*
\* Bounded model: a handful of orders, two clearing prices, a bounded
\* sequence of state-machine events. Small enough for TLC to exhaust the
\* state space exhaustively; the point is full coverage of the state machine,
\* not realistic volume.
\*
\* BROKEN_NO_REOPEN = FALSE  -> real spec: the VolatilityAuction -> Continuous
\* reopening uncross is enabled, so VolatilityEventuallyReopens holds under
\* weak fairness. For the non-vacuity check, see AuctionBroken.cfg, which sets
\* BROKEN_NO_REOPEN = TRUE and makes TLC report a counterexample.

SPECIFICATION Spec

CONSTANTS
    MaxOrders        = 3
    MaxEvents        = 6
    Prices           = {100, 200}
    BROKEN_NO_REOPEN = FALSE

INVARIANTS
    TypeOK
    ValidState
    NoMatchOutsideContinuousExceptUncross
    SingleClearingPrice
    NoTradeWhileHalted

PROPERTIES
    ValidTransitions
    VolatilityEventuallyReopens
