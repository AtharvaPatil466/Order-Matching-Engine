\* Non-vacuity variant of MatchingEngineDeep.cfg: a fill that empties a
\* resting order swap-erases it, so the level's last order takes its slot
\* (the O(1) erase that reordered the parked-market list, MIDS-4). TLC must
\* report "Invariant FIFO_Preservation is violated"; tla.yml requires it.
\* The same bug PASSES at MatchingEngine.cfg, whose bound never fills an
\* order with two behind it.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 4
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100}
    MaxQty = 3
    BUG = "fill_swap_remove"

INVARIANTS
    NoNegativeQuantity
    NoEmptyRestingOrder
    FIFO_Preservation
    MatchingConservation
    NoCrossedBookAfterStep
    NoSelfTrade

PROPERTIES
    PricePriority
    FIFOExecution
    ExecPriceIsPassive
