\* NON-VACUITY / BUG-INJECTED config for MatchingEngine.tla (P1-7).
\*
\* Identical to MatchingEngine.cfg EXCEPT BROKEN_NO_FIFO = TRUE, which makes
\* the Match action consume a NON-earliest resting order at the best price
\* (the youngest in the queue) whenever more than one order rests there.
\* That is a time-priority (FIFO) violation, so TLC must report a reachable
\* state violating FIFOExecution. This proves FIFOExecution is not vacuously
\* true: Match genuinely fires and the invariant carries real weight.
\*
\* Run it explicitly (check.sh auto-loads <Module>.cfg, so override -config):
\*   ./check.sh MatchingEngine MatchingEngineBroken.cfg
\*
\* Expected result: TLC reports
\*   "Invariant FIFOExecution is violated."
\* with a short trace, e.g.
\*   Init
\*     -> PlaceLimit(_, Buy,  200, _)   (order 1, ts 1)
\*     -> PlaceLimit(_, Buy,  200, _)   (order 2, ts 2)
\*     -> PlaceLimit(_, Sell, 100, _)   (order 3, ts 3)
\*     -> Match                          (fills order 2 while older order 1 rests)
\*
\* The other invariants still HOLD under the bug (picking a non-front order
\* changes only WHICH resting order trades, not the quantity accounting or
\* the intra-queue ordering), so they remain listed to document that the bug
\* breaks ONLY time priority — TLC stops on the intended FIFOExecution
\* violation.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    MaxTime = 2
    BROKEN_NO_FIFO = TRUE

INVARIANTS
    NoNegativeQuantity
    FIFO_Preservation
    MatchingConservation
    FIFOExecution
    GTD_Expiry_Correctness
