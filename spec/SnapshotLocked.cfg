\* TLC config for SnapshotLocked.tla.
\* Verifies the strong consistency properties that were COUNTEREXAMPLES
\* in the unlocked spec. With the bookLock_ shared_mutex held by the
\* reader for the duration of its 2-step snapshot, both
\* SnapshotIsPointInTime and NoDoubleSidedSnapshot must hold for every
\* reachable state.

