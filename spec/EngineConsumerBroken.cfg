\* Non-vacuity variant of EngineConsumer.cfg: the worker samples wakeCount
\* after its empty check instead of before it, so a push in between is a
\* lost wake-up. TLC must stop with "Deadlock reached": the worker sleeps
\* with an item in the queue and no producer left to wake it.
\* .github/workflows/tla.yml requires that.

SPECIFICATION Spec

CONSTANTS
    BUG = "snapshot_at_sleep"

INVARIANTS
    TypeOK
    NoSpuriousItems
    NoDuplicates

PROPERTIES
    EventuallyDrained
