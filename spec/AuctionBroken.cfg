\* Non-vacuity cfg for Auction.tla: BUG = "no_reopen" (the volatility reopening never fires, so a VolatilityAuction can last forever).
\* TLC must report a VolatilityEventuallyReopens counterexample; .github/workflows/tla.yml fails
\* the build if it passes or fails for any other reason. Bounds as Auction.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxEvents = 6
    MaxDate   = 2
    Prices    = {100, 200}
    BUG       = "no_reopen"

PROPERTIES
    VolatilityEventuallyReopens
