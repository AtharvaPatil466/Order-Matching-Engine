\* NON-VACUITY / BUG-INJECTED config for Auction.tla.
\*
\* Identical to Auction.cfg EXCEPT BROKEN_NO_REOPEN = TRUE, which disables the
\* VolatilityAuction -> Continuous reopening uncross (ReopeningUncross becomes
\* permanently un-enabled). VolatilityAuction is now ABSORBING, so the
\* liveness property VolatilityEventuallyReopens is FALSE and TLC must report
\* a temporal counterexample. This proves the property has teeth — it is not
\* vacuously true.
\*
\* Run it explicitly (check.sh auto-loads <Module>.cfg, so override -config):
\*   java -cp tla2tools.jar tlc2.TLC -config AuctionBroken.cfg Auction
\*
\* Expected: "Temporal properties were violated." with a lasso ending in a
\* cycle that stays in VolatilityAuction forever.
\*
\* The safety invariants still hold in the broken model (the bug only removes
\* a transition; it never produces an illegal trade), so they remain listed.

SPECIFICATION Spec

CONSTANTS
    MaxOrders        = 3
    MaxEvents        = 6
    Prices           = {100, 200}
    BROKEN_NO_REOPEN = TRUE

INVARIANTS
    TypeOK
    ValidState
    NoMatchOutsideContinuousExceptUncross
    SingleClearingPrice
    NoTradeWhileHalted

PROPERTIES
    ValidTransitions
    VolatilityEventuallyReopens
