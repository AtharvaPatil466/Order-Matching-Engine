version: "3.9"

services:
  # ── Primary Matching Engine ──
  engine-primary:
    build: .
    container_name: orderengine-primary
    command: ["--threads", "4", "--port", "8080", "--symbols", "4"]
    ports:
      - "8080:8080"    # Admin HTTP
      - "9001:9001"    # FIX Gateway
    volumes:
      - journal-primary:/app/journal
      - ./config/engine.conf.example:/app/config/engine.conf:ro
    environment:
      - OB_THREADS=4
      - OB_JOURNAL_PATH=/app/journal/primary.wal
      # No OB_NODE_ROLE: replication is disabled unless explicitly acknowledged
      # (--allow-unsafe-replication) because of known defects REPL-1..6 — a
      # deposed primary is never fenced and a promoted backup can execute
      # orders twice. This deployment is a single node; the backup service
      # that used to follow this one is gone. deploy/chaos still runs the
      # 1+1 topology, opted in, because it exists to exercise that path.
      # Fail-closed: compose refuses to start without a token so the
      # admin API is never exposed unauthenticated. Set in .env or:
      #   OB_ADMIN_TOKEN=$(openssl rand -hex 32) docker compose up
      - OB_ADMIN_TOKEN=${OB_ADMIN_TOKEN:?set OB_ADMIN_TOKEN — bearer token for the admin API}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Market Data Subscriber ──
  md-subscriber:
    build: .
    container_name: orderengine-mdsub
    entrypoint: ["/app/MdSubscriber"]
    command: ["orderengine_md"]
    depends_on:
      engine-primary:
        condition: service_healthy

volumes:
  journal-primary:
