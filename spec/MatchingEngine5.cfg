\* Higher-bound rerun of MatchingEngine.tla (reviewer request): MaxOrders bumped
\* from 3 to 5 so the model explores >=3 resting orders at one price level — the
\* regime where FIFO time-priority bugs actually manifest (a third+ order at the
\* same level is where insertion/removal can break timestamp ordering). All other
\* constants unchanged from MatchingEngine.cfg. BROKEN_NO_FIFO = FALSE (real spec).
SPECIFICATION Spec

CONSTANTS
    MaxOrders = 5
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    MaxTime = 2
    BROKEN_NO_FIFO = FALSE

INVARIANTS
    NoNegativeQuantity
    FIFO_Preservation
    MatchingConservation
    FIFOExecution
    GTD_Expiry_Correctness
