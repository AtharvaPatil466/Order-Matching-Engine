name: TLA+ Model Checking

# Model-checks the project's TLA+ specifications with TLC on every push / PR.
#
# What each spec models, and whether the shipped binary (OrderEngine)
# runs that code by default, is in docs/Verification.md ("Scope"). In short:
#   - MatchingEngine   : OrderBook::match / modifyOrder / cancelReplace  (runs)
#   - Auction          : session table, volatility auction, uncross      (runs:
#                        the breaker by default, sessions with --session-schedule)
#   - MpscQueue        : the per-worker request queue (include/MpscQueue.h)  (runs)
#   - EngineConsumer   : MatchingEngine::workerLoop wake-up protocol      (runs)
#   - SnapshotLocked   : OrderBook::getSnapshot under bookLock_   (runs: admin /book)
#   - Oco, Risk        : ContingencyManager, HierarchicalRiskManager + the
#                        position ledger: LIBRARY ONLY. OrderEngine never calls
#                        registerOco, mapParticipant, setRiskTierLimits or
#                        setPositionLimit, so it never executes this code.
#
# MatchingEngine.tla is checked at MatchingEngine.cfg (about a minute) and at
# MatchingEngineDeep.cfg (one price, four orders: a fill reaches a level
# three deep; about two minutes), and each of its eight broken variants must
# fail with the counterexample its injected bug produces;
# MatchingEngineDeepBrokenSwap.cfg's bug passes at MatchingEngine.cfg.
#
# Trace validation: TraceValidationTest (C++) records what OrderBook does on
# Limit/Cancel/Modify/Replace flows, and TLC checks every trace is a
# behaviour of MatchingEngine.tla (spec/TraceMatchingEngine.tla). Auction.tla's AuctionBrokenEdge.cfg
# and AuctionBrokenDate.cfg (an illegal session transition) and
# AuctionBrokenHalt.cfg (a halt that resumes to Continuous from a closing
# auction) must fail the same way.
#
# EngineConsumerBroken.cfg (the worker samples its wake counter after the
# empty check) must stop with "Deadlock reached": TLC's deadlock check is on
# for every spec (spec/check.sh), and each spec that legitimately ends says
# so with an explicit terminal step.
#
# A dedicated step also runs the Auction NON-VACUITY variant
# (AuctionBroken.cfg, BUG = "no_reopen") and asserts that TLC reports a
# counterexample to VolatilityEventuallyReopens — proving the liveness
# property has teeth.

on:
  push:
  pull_request:

jobs:
  tlc:
    name: TLC model checking
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: spec/tla2tools.jar
          key: tla2tools-jar-v1.7.4

      - name: Check fast specs
        working-directory: spec
        run: |
          set -e
          for module in Auction MpscQueue EngineConsumer SnapshotLocked; do
            echo "::group::TLC $module"
            ./check.sh "$module"
            echo "::endgroup::"
          done

      - name: Check library-only specs (code OrderEngine does not run)
        working-directory: spec
        run: |
          set -e
          for module in Oco Risk; do
            echo "::group::TLC $module"
            ./check.sh "$module"
            echo "::endgroup::"
          done

      - name: Check MatchingEngine
        working-directory: spec
        run: ./check.sh MatchingEngine

      - name: Check MatchingEngine at queue depth three (MatchingEngineDeep.cfg, ~2 min)
        working-directory: spec
        run: ./check.sh MatchingEngine MatchingEngineDeep.cfg

      - name: Trace validation (the C++ book's traces are behaviours of MatchingEngine.tla)
        # tests/TraceValidationTest.cpp runs 300 seeded Limit/Cancel/Modify/
        # Replace flows on OrderBook and has TLC check each is a behaviour of
        # spec/MatchingEngine.tla (spec/TraceMatchingEngine.tla), then that a
        # sweep reported out of order is rejected. It SKIPs without java and
        # spec/tla2tools.jar, so here a skip is a failure.
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF
          cmake --build build --parallel 4 --target TraceValidationTest
          ./build/tests/TraceValidationTest | tee trace_validation.log
          if grep -q "SKIPPED" trace_validation.log; then
            echo "::error::TraceValidationTest skipped: java or spec/tla2tools.jar missing"
            exit 1
          fi

      - name: Non-vacuity checks (each injected MatchingEngine / Auction bug must be caught)
        working-directory: spec
        run: |
          fail=0
          while read -r module cfg expect; do
            set +e
            ./check.sh "$module" "$cfg" > "$cfg.log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::error::$cfg unexpectedly PASSED — its property is vacuous"
              fail=1
            elif ! grep -qF "$expect" "$cfg.log"; then
              cat "$cfg.log"
              echo "::error::$cfg failed for the wrong reason (expected: $expect)"
              fail=1
            else
              echo "$cfg: $expect"
            fi
          done <<'EOF'
          MatchingEngine MatchingEngineBroken.cfg Action property FIFOExecution is violated
          MatchingEngine MatchingEngineBrokenPrice.cfg Action property PricePriority is violated
          MatchingEngine MatchingEngineBrokenExecPrice.cfg Action property ExecPriceIsPassive is violated
          MatchingEngine MatchingEngineBrokenCross.cfg Invariant NoCrossedBookAfterStep is violated
          MatchingEngine MatchingEngineBrokenStp.cfg Invariant NoSelfTrade is violated
          MatchingEngine MatchingEngineBrokenModify.cfg Invariant NoEmptyRestingOrder is violated
          MatchingEngine MatchingEngineBrokenReplace.cfg Invariant FIFO_Preservation is violated
          MatchingEngine MatchingEngineDeepBrokenSwap.cfg Invariant FIFO_Preservation is violated
          Auction AuctionBrokenEdge.cfg Action property ValidTransitions is violated
          Auction AuctionBrokenDate.cfg Action property ValidTransitions is violated
          Auction AuctionBrokenHalt.cfg Invariant NoReopenAfterClose is violated
          EngineConsumer EngineConsumerBroken.cfg Error: Deadlock reached.
          SnapshotLocked SnapshotLockedBroken.cfg Invariant SnapshotIsPointInTime is violated
          EOF
          exit "$fail"

      - name: Non-vacuity check (Auction liveness must be violable)
        working-directory: spec
        run: |
          set +e
          ./check.sh Auction AuctionBroken.cfg > broken.log 2>&1
          status=$?
          set -e
          cat broken.log
          if [ "$status" -eq 0 ]; then
            echo "::error::AuctionBroken.cfg unexpectedly PASSED — VolatilityEventuallyReopens is vacuous"
            exit 1
          fi
          if ! grep -q "Temporal property VolatilityEventuallyReopens was violated" broken.log; then
            echo "::error::AuctionBroken.cfg failed for the wrong reason (expected a VolatilityEventuallyReopens counterexample)"
            exit 1
          fi
          echo "Non-vacuity confirmed: TLC produced the expected counterexample."

      - name: Non-vacuity check (OCO safety must be violable)
        working-directory: spec
        run: |
          set +e
          ./check.sh Oco OcoBroken.cfg > oco_broken.log 2>&1
          status=$?
          set -e
          cat oco_broken.log
          if [ "$status" -eq 0 ]; then
            echo "::error::OcoBroken.cfg unexpectedly PASSED — AtMostOneWinnerPerGroup is vacuous"
            exit 1
          fi
          if ! grep -q "Invariant AtMostOneWinnerPerGroup is violated" oco_broken.log; then
            echo "::error::OcoBroken.cfg failed for the wrong reason (expected an AtMostOneWinnerPerGroup counterexample)"
            exit 1
          fi
          echo "Non-vacuity confirmed: TLC produced the expected OCO counterexample."

      - name: Non-vacuity check (risk aggregation must be violable)
        working-directory: spec
        run: |
          set +e
          ./check.sh Risk RiskBroken.cfg > risk_broken.log 2>&1
          status=$?
          set -e
          cat risk_broken.log
          if [ "$status" -eq 0 ]; then
            echo "::error::RiskBroken.cfg unexpectedly PASSED — FirmWithinCap is vacuous"
            exit 1
          fi
          if ! grep -q "Invariant FirmWithinCap is violated" risk_broken.log; then
            echo "::error::RiskBroken.cfg failed for the wrong reason (expected a FirmWithinCap counterexample)"
            exit 1
          fi
          echo "Non-vacuity confirmed: TLC produced the expected risk counterexample."
