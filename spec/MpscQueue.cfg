\* TLC configuration for MpscQueue.tla.
\*
\* Bounded model: 2 producers × 2 items each (4 items total), 2 slots.
\* Small enough for TLC to exhaust the state space; large enough to
\* exercise queue-full, contended-CAS, and the claim-without-publish
\* window. Adjust model size by editing constants in MpscQueue.tla.

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoSpuriousItems
    NoDuplicates
    PerProducerFIFO

PROPERTIES
    EventuallyDrained
