\* TLC config for Oco.tla — the CORRECT engine (BROKEN_NO_OCO_CANCEL = FALSE).
\*
\* Bounded model (small enough to exhaust the state space):
\*   - 6 orders.
\*   - One 2-leg OCO group {o1, o2} and one 3-leg OCO group {o3, o4, o5}.
\*   - o6 is ungrouped (a free order) and may Execute with no linkage.
\* With the correct Execute (winner cancels its Live siblings atomically),
\* AtMostOneWinnerPerGroup and WinnerSilencesSiblings must hold for every
\* reachable state.

SPECIFICATION Spec

CONSTANTS
    Orders = {o1, o2, o3, o4, o5, o6}
    Groups = {{o1, o2}, {o3, o4, o5}}
    BROKEN_NO_OCO_CANCEL = FALSE

INVARIANTS
    TypeOK
    ValidStates
    AtMostOneWinnerPerGroup
    WinnerSilencesSiblings
