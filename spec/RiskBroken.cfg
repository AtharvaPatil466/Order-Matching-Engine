\* NON-VACUITY / BUG-INJECTED config for Risk.tla.
\*
\* Identical to Risk.cfg EXCEPT BROKEN_NO_FIRM_AGG = TRUE, which drops the
\* firm-tier (aggregate) check from Submit: an order is admitted on the
\* TRADER cap alone and still booked to both tiers. With FirmCap = 3 and
\* PerTraderCap = 2, T1 and T2 can each reach 2 — both individually
\* legal — so the firm aggregate climbs to 4 > FirmCap. TLC must then report a
\* reachable state violating FirmWithinCap. This non-vacuity check proves the
\* firm-aggregate guard actually carries the safety weight (the invariant has
\* teeth).
\*
\* Run it explicitly (check.sh auto-loads <Module>.cfg, so override -config):
\*   ./check.sh Risk RiskBroken.cfg
\*
\* Expected result: TLC reports
\*   "Invariant FirmWithinCap is violated."
\* with a short error trace (Init -> Submit -> Submit pushing pos[F] to 4).
\*
\* We check ONLY the structural invariants plus FirmWithinCap here.
\* TradersWithinCap and FirmIsSumOfTraders still HOLD under the bug (the
\* trader-tier guard and the lock-step booking are untouched), so they remain
\* listed to document that the bug breaks ONLY the firm-aggregate guarantee —
\* TLC stops on the intended FirmWithinCap violation.

SPECIFICATION Spec

CONSTANTS
    Traders      = {T1, T2}
    Firm         = F
    FirmCap      = 3
    PerTraderCap = 2
    Qtys         = {1, 2}
    BROKEN_NO_FIRM_AGG = TRUE

INVARIANTS
    TypeOK
    FirmWithinCap
    TradersWithinCap
    FirmIsSumOfTraders
