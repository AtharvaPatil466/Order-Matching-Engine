\* TLC config for MatchingEngine.tla, run by .github/workflows/tla.yml on
\* every push. Counts from the last run are in docs/Verification.md.
\*
\* Three orders can rest two at one level and cross them with a third, so
\* FIFO selection, partial fills, a sweep across both price levels, STP and a
\* replace that re-aggresses are all reachable.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "none"

INVARIANTS
    NoNegativeQuantity
    NoEmptyRestingOrder
    FIFO_Preservation
    MatchingConservation
    NoCrossedBookAfterStep
    NoSelfTrade

PROPERTIES
    PricePriority
    FIFOExecution
    ExecPriceIsPassive
