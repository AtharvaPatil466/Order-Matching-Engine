\* TLC config for EngineConsumer.tla.
\* Default model: 2 producers × 2 items each, abstract queue (sequence).
\* Verifies the wake-up protocol used by MatchingEngine::workerLoop.
\* Deadlock checking is on (spec/check.sh): the only accepted end state is
\* the idle worker (Idle in the spec).

SPECIFICATION Spec

CONSTANTS
    BUG = "none"

INVARIANTS
    TypeOK
    NoSpuriousItems
    NoDuplicates

PROPERTIES
    EventuallyDrained
