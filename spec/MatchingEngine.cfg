\* TLC config for MatchingEngine.tla — the order book + matching layer.
\*
\* Bounded model (small enough for TLC to exhaust): 3 orders max, two
\* participants, two price levels, quantities 1..3, clock 0..2. Three orders
\* is enough to rest two on one side of a price level and cross a third,
\* exercising multi-order FIFO selection, partial fills, and full fills. The
\* clock is bounded tightly (GTD never fires in this model, so time only
\* bounds AdvanceTime); adding the matching layer expands the state space, so
\* the clock range is trimmed from the pre-matching spec to keep TLC
\* exhaustive. The point is full coverage of book management AND price-time
\* execution, not volume.
\*
\* BROKEN_NO_FIFO = FALSE -> real spec: Match consumes the FIFO-earliest
\* resting order at the best price, so FIFOExecution holds. For the
\* non-vacuity check, see MatchingEngineBroken.cfg, which sets
\* BROKEN_NO_FIFO = TRUE and makes TLC report a FIFOExecution counterexample.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    MaxTime = 2
    BROKEN_NO_FIFO = FALSE

INVARIANTS
    NoNegativeQuantity
    FIFO_Preservation
    MatchingConservation
    FIFOExecution
    GTD_Expiry_Correctness
