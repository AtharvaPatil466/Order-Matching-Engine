\* Non-vacuity cfg for MatchingEngine.tla: BUG = "rest_crossed" (Rest may fire while the aggressor still crosses).
\* TLC must report a NoCrossedBookAfterStep counterexample; .github/workflows/tla.yml fails the
\* build if it passes or fails for any other reason. Bounds as MatchingEngine.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "rest_crossed"

INVARIANTS
    NoCrossedBookAfterStep
