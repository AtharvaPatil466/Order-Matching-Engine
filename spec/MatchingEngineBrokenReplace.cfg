\* Non-vacuity cfg for MatchingEngine.tla: BUG = "replace_keeps_priority" (Replace keeps the old timestamp).
\* TLC must report a FIFO_Preservation counterexample; .github/workflows/tla.yml fails the
\* build if it passes or fails for any other reason. Bounds as MatchingEngine.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "replace_keeps_priority"

INVARIANTS
    FIFO_Preservation
