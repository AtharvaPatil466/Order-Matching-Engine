\* TLC config for Risk.tla — the CORRECT multi-tier RiskManager
\* (BROKEN_NO_FIRM_AGG = FALSE).
\*
\* Bounded model (small enough to exhaust the state space):
\*   - One firm (F) with two traders, T1 and T2.
\*   - FirmCap = 3 (the aggregate cap).
\*   - PerTraderCap = 2, so each trader alone could reach 2, and their
\*     UNCHECKED sum could reach 4 > FirmCap.
\*   - Order sizes Qtys = {1, 2} (buys only).
\* The firm-aggregate guard is what keeps pos[Firm] <= 3: without it the two
\* traders would together reach 4. With the correct (two-tier) Submit,
\* FirmWithinCap, TradersWithinCap and FirmIsSumOfTraders must hold for every
\* reachable state. (See RiskBroken.cfg for the non-vacuity counterexample.)

SPECIFICATION Spec

CONSTANTS
    Traders      = {T1, T2}
    Firm         = F
    FirmCap      = 3
    PerTraderCap = 2
    Qtys         = {1, 2}
    BROKEN_NO_FIRM_AGG = FALSE

INVARIANTS
    TypeOK
    FirmWithinCap
    TradersWithinCap
    FirmIsSumOfTraders
