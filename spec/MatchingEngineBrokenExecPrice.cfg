\* Non-vacuity cfg for MatchingEngine.tla: BUG = "aggressor_price" (a fill prints at the aggressor's limit).
\* TLC must report a ExecPriceIsPassive counterexample; .github/workflows/tla.yml fails the
\* build if it passes or fails for any other reason. Bounds as MatchingEngine.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100, 200}
    MaxQty = 3
    BUG = "aggressor_price"

PROPERTIES
    ExecPriceIsPassive
