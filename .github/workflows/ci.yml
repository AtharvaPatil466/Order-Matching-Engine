name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Release
            os: macos-latest
            build_type: Release
            sanitizers: "OFF"
            thread_sanitizer: "OFF"
          - name: Ubuntu Debug Sanitizers
            os: ubuntu-24.04
            build_type: Debug
            sanitizers: "ON"
            thread_sanitizer: "OFF"
          - name: Ubuntu ThreadSanitizer
            os: ubuntu-24.04
            build_type: Debug
            sanitizers: "OFF"
            thread_sanitizer: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DENABLE_THREAD_SANITIZER=${{ matrix.thread_sanitizer || 'OFF' }}
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=${{ matrix.thread_sanitizer == 'ON' && 'OFF' || 'ON' }}

      - name: Build
        # Bounded parallelism, not `--parallel` (which fans out to nproc).
        # A sanitizer build of this tree peaks at a few GB per translation
        # unit, and four of those at once OOM-kills cc1plus on a standard
        # runner — which surfaces as "Killed signal terminated program
        # cc1plus" and exit 143, not as a compile error. Two keeps headroom;
        # the wall-clock cost is far smaller than a red lane nobody trusts.
        run: cmake --build build --parallel ${{ (matrix.sanitizers == 'ON' || matrix.thread_sanitizer == 'ON') && '2' || '4' }}

      - name: Test
        if: matrix.thread_sanitizer != 'ON'
        run: ctest --test-dir build --output-on-failure -L project -E '^BenchmarkRegressionTest\.'

      - name: Test under ThreadSanitizer
        # Exclusions documented:
        #   BenchmarkRegressionTest.* — perf-only, no thread-safety surface
        #                                (excluded from every lane but the gate)
        # PropertyTest is INCLUDED (roadmap 1.7): it takes 35-45s under TSan in
        # the ubuntu:24.04 arm64 container, which is slower than this runner,
        # against its 180s TIMEOUT. It was excluded as "impractically slow".
        # AdminServerEndpointsTest is INCLUDED: its accept/recv teardown race
        # was fixed (atomic serverSocket_), and it now scrapes /audit and
        # /metrics under live async order flow — the admin readers of
        # worker-owned state this lane exists to check.
        # ANCHORED, every name: ctest -E is a regex SEARCH, and the unanchored
        # "PropertyTest" also excluded JournalReplayPropertyTest — the test that
        # drives the async worker — from the one lane that checks it for races.
        if: matrix.thread_sanitizer == 'ON'
        run: ctest --test-dir build --output-on-failure -L project -E '^BenchmarkRegressionTest\.'

      - name: Benchmark smoke
        if: matrix.os == 'ubuntu-24.04' && matrix.thread_sanitizer != 'ON'
        # This is a "does it run + emit output" smoke, not a timing measurement.
        # It runs on the Debug+sanitizer build (the only non-TSan ubuntu job), where
        # ASan/UBSan instrumentation makes E2EBenchmark run many times slower than
        # Release — so the ceiling is generous. It only costs wall-time if the binary
        # actually hangs; a healthy run finishes well under it.
        run: |
          timeout 300s ./build/benchmarks/E2EBenchmark > e2e_benchmark_smoke.txt
          test -s e2e_benchmark_smoke.txt

      - name: Upload benchmark smoke artifact
        if: matrix.os == 'ubuntu-24.04' && matrix.thread_sanitizer != 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-benchmark-smoke-${{ matrix.name }}
          path: e2e_benchmark_smoke.txt

  latency-gate:
    name: Ubuntu Release Latency Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The p99 thresholds in tests/BenchmarkRegression.cpp are calibrated for
      # an optimized x86 Release build, and CMake only defines
      # OB_ENFORCE_LATENCY_THRESHOLD for Release-without-fault-injection. Until
      # this lane existed no workflow met that description: ci.yml ran macOS
      # Release plus Ubuntu Debug/ASan and Ubuntu TSan Debug, every one of them
      # excluding BenchmarkRegressionTest, and benchmark-gate.yml builds Ubuntu
      # Release with -DBUILD_TESTS=OFF. The gate compiled, skipped itself, and
      # enforced nothing anywhere.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_SANITIZERS=OFF
          -DENABLE_FAULT_INJECTION=OFF
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Enforce p99 latency thresholds
        # ONLY this label, and never under -j: the thresholds are calibrated
        # single-threaded and uncontended, so running alongside the rest of the
        # suite inflates p99 and false-fails (the target already sets
        # RUN_SERIAL, this keeps the lane honest end to end).
        #
        # until-pass:2 because a p99 on a shared runner is a statistical
        # measurement, and one noisy-neighbour spike is not a regression. A
        # real regression is reproducible and fails both attempts. Without the
        # retry this lane flakes, and a flaky gate gets switched off again —
        # which is how it became a dead letter the first time.
        run: ctest --test-dir build --output-on-failure -L benchmark-regression --repeat until-pass:2

  lean-mode:
    name: Ubuntu Lean Mode
    # USE_LEAN_MODE=ON had been broken in the CMake build and nobody noticed,
    # because no job here ever built it: two -Werror,-Wunused-parameter errors
    # from OB_LEAN_MODE compiling out the only consumers of those parameters.
    #
    # It is not an obscure option. README quotes a lean build command,
    # docs/CapacityPlanning.md has a "Throughput (lean)" column, and roadmap.md
    # frames a 13x lean-vs-full gap as a headline. A configuration that is cited
    # as a performance baseline has to be one the build system can actually
    # produce, so it gets a lane.
    #
    # THIS LANE IS BUILD-ONLY, AND THAT IS A DELIBERATE LIMIT, NOT AN OVERSIGHT.
    #
    # 48 of 519 tests fail under USE_LEAN_MODE=ON, concentrated in exactly the
    # features it compiles out: self-trade prevention (14), risk limits and
    # circuit breakers, MOC/LOC, and the audit path. That is not a regression —
    # those tests assert behaviour lean mode deliberately removes.
    #
    # The real gap is that LEAN MODE HAS NO DEFINED BEHAVIOURAL CONTRACT. Nobody
    # has written down which invariants it must still hold, so there is no
    # honest subset to run here, and inventing an exclusion list would assert a
    # contract that was never agreed. Gating on compilation catches the defect
    # this lane exists for; claiming more would be the kind of unearned
    # assurance the rest of this repo has been removing.
    #
    # Defining that contract — "lean preserves price-time priority, conservation
    # and FIFO; it does not preserve STP, risk limits or circuit breakers" — is
    # the follow-up, and then this lane runs that subset.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_LEAN_MODE=ON
          -DBUILD_TESTS=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Smoke — the engine binary starts and exits cleanly
        # The weakest useful check beyond compilation: the lean binary links and
        # runs. Not a behavioural gate — see the note above.
        run: ./build/OrderEngine --help > /dev/null

  io-uring:
    name: Ubuntu io_uring Journal
    # No other lane installs liburing, so OB_HAVE_LIBURING was never defined in
    # CI: the io_uring journal commit path — the one every Linux build with
    # liburing ships — was compiled and run by nothing here (roadmap 1.3-C5,
    # 2.9). This lane builds it and runs the suite on it.
    #
    # Two checks keep it honest. The configure log must say the path is enabled
    # (a compile-time fact), and a probe must get a ring from the kernel (a
    # runtime one): if io_uring_queue_init fails, the journal falls back to its
    # synchronous path without a word, and this lane would quietly test that
    # instead. Same probe as scripts/verify_linux.sh.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: io_uring is available at runtime
        run: |
          printf '#include <liburing.h>\nint main(void){struct io_uring r;if(io_uring_queue_init(8,&r,0)<0)return 1;io_uring_queue_exit(&r);return 0;}\n' \
            | gcc -x c -o uring_probe - -luring
          ./uring_probe

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF
          2>&1 | tee configure.log

      - name: The io_uring journal path is compiled in
        run: grep -F 'io_uring journal path enabled' configure.log

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -L project -E '^BenchmarkRegressionTest\.'

  fault-injection:
    name: Ubuntu Fault Injection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_FAULT_INJECTION=ON
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        # Full suite with fault-injection points compiled in (OB_ENABLE_FAULT_INJECTION).
        # Without this lane, the hostile-queue regressions are vacuous passes:
        # QueueChaosTest main() returns 0 with a printed notice when the macro is
        # undefined, and MpscQueue's shouldFail() hooks compile to constexpr-false.
        # QueueChaosTest arms queue.push.spurious_fail / queue.pop.spurious_empty
        # and asserts no lost/duplicated orders under 50-95% injected push failures.
        # Exclusions documented:
        #   BenchmarkRegressionTest — perf-only; FI adds per-push/pop overhead,
        #                             so its thresholds are meaningless here
        run: ctest --test-dir build --output-on-failure -L project -E '^BenchmarkRegressionTest\.'

  wide-diff-fuzz:
    name: Ubuntu Wide Differential Fuzz
    # The widened differential fuzzer (roadmap 1.3-C1): modify, replace,
    # icebergs, STP modes, kill switch and execution reports against a
    # price-time reference, 60 seeds x 2000 ops under ASan/UBSan. Blocking
    # since the event-order spec landed (MatchingRules Rule 2.5, GTDIFF-7), per
    # the user's decision 2 (2026-10-05); 1.6-F5 fixed the FOK + STP class
    # (GTDIFF-2). It has no known classes: anything it finds is a new defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_SANITIZERS=ON
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel 4 --target WideDifferentialFuzz

      - name: Fuzz, every class
        run: ./build/tests/WideDifferentialFuzz --seeds 60 --ops 2000 --report 4 --ice --stp-modes --kill

  gateway-engine-fuzz:
    name: Ubuntu libFuzzer gateway -> engine (10 min)
    # Roadmap 1.6 "Done": a single legal or illegal message cannot corrupt the
    # book. fuzz_gateway_engine feeds client bytes through TcpGateway's framer
    # and decodeFrame into MatchingEngine::submitOrder, then requires
    # OrderBook::validateIntegrity on every book, for 10 minutes under ASan and
    # halting UBSan with the engine's asserts armed. A crash, sanitizer report
    # or integrity failure fails the job and uploads the reproducer, which
    # fuzz_gateway_engine_replay runs on any compiler.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and the libFuzzer runtime
        # libclang-rt-dev carries libclang_rt.fuzzer; clang alone does not, and
        # without it HAVE_LIBFUZZER is false and the Build step finds no target.
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev

      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_FUZZERS=ON
          -DBUILD_TESTS=OFF
          -DBUILD_BENCHMARKS=OFF
          -DBUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build-fuzz --parallel 4 --target fuzz_gateway_engine

      - name: Fuzz for 10 minutes
        run: |
          python3 fuzz/gen_gateway_seeds.py fuzz-corpus
          mkdir -p fuzz-artifacts
          ./build-fuzz/fuzz/fuzz_gateway_engine -max_total_time=600 -timeout=10 \
            -rss_limit_mb=4096 -print_final_stats=1 \
            -artifact_prefix=fuzz-artifacts/ fuzz-corpus

      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-engine-fuzz-artifacts
          path: fuzz-artifacts/

  feature-macro-lanes:
    name: Every CMake feature macro has a lane
    # Roadmap 2.9: every #ifdef'd production path has a CI lane that builds it,
    # or an explicit reason in scripts/feature_macro_lanes.txt why none does.
    # A new OB_* compile definition with neither fails here. No build needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check every OB_* macro against ci.yml
        run: sh scripts/check_feature_macro_lanes.sh

  docker-image:
    name: Docker image
    # Non-required. chaos.yml was the only job that built the image, and it went
    # with replication (roadmap 1.1), so nothing else checks that the image
    # builds, refuses a replication role and boots.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ob-engine:ci .

      - name: A replication role is refused
        run: |
          rc=0; docker run --rm ob-engine:ci --role primary || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::--role primary exited $rc, want 1"; exit 1; }

      - name: Boots and answers /health
        run: |
          docker run -d --name ob -p 8080:8080 \
            -e OB_ADMIN_TOKEN=ci -e OB_NO_PARTICIPANT_AUTH=1 ob-engine:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs ob; exit 1
