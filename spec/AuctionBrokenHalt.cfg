\* Non-vacuity cfg for Auction.tla: BUG = "halt_detour" (Halted -> Continuous is allowed whatever the book was halted from).
\* TLC must report a NoReopenAfterClose counterexample (Continuous -> AuctionClose -> Halted -> Continuous);
\* .github/workflows/tla.yml fails the build if it passes or fails for any other reason. Bounds as Auction.cfg.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 3
    MaxEvents = 6
    MaxDate   = 2
    Prices    = {100, 200}
    BUG       = "halt_detour"

INVARIANTS
    NoReopenAfterClose
