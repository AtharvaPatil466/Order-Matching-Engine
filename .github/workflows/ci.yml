name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Release
            os: macos-latest
            build_type: Release
            sanitizers: "OFF"
            thread_sanitizer: "OFF"
          - name: Ubuntu Debug Sanitizers
            os: ubuntu-latest
            build_type: Debug
            sanitizers: "ON"
            thread_sanitizer: "OFF"
          - name: Ubuntu ThreadSanitizer
            os: ubuntu-latest
            build_type: Debug
            sanitizers: "OFF"
            thread_sanitizer: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DENABLE_THREAD_SANITIZER=${{ matrix.thread_sanitizer || 'OFF' }}
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=${{ matrix.thread_sanitizer == 'ON' && 'OFF' || 'ON' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        if: matrix.thread_sanitizer != 'ON'
        run: ctest --test-dir build --output-on-failure -L project -E 'BenchmarkRegressionTest'

      - name: Test under ThreadSanitizer
        # Exclusions documented:
        #   BenchmarkRegressionTest — perf-only, no thread-safety surface
        #   PropertyTest             — heavy fuzzer; TSan x ASan x property
        #                              fuzzing is impractically slow in CI
        #   AdminServerEndpointsTest — accept/recv races acceptable for an
        #                              admin port; not on the data path
        # ReplicationProtocolTest is INCLUDED now — was previously excluded
        # for teardown races on peerFd_/listenFd_ (close-during-recv) and a
        # non-atomic sendSeq_; both fixed (atomic fds + shutdown(2) wakeup +
        # atomic sequence). Keep TSan green going forward.
        if: matrix.thread_sanitizer == 'ON'
        run: ctest --test-dir build --output-on-failure -L project -E 'BenchmarkRegressionTest|PropertyTest|AdminServerEndpointsTest'

      - name: Benchmark smoke
        if: matrix.os == 'ubuntu-latest' && matrix.thread_sanitizer != 'ON'
        # This is a "does it run + emit output" smoke, not a timing measurement.
        # It runs on the Debug+sanitizer build (the only non-TSan ubuntu job), where
        # ASan/UBSan instrumentation makes E2EBenchmark run many times slower than
        # Release — so the ceiling is generous. It only costs wall-time if the binary
        # actually hangs; a healthy run finishes well under it.
        run: |
          timeout 300s ./build/benchmarks/E2EBenchmark > e2e_benchmark_smoke.txt
          test -s e2e_benchmark_smoke.txt

      - name: Upload benchmark smoke artifact
        if: matrix.os == 'ubuntu-latest' && matrix.thread_sanitizer != 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-benchmark-smoke-${{ matrix.name }}
          path: e2e_benchmark_smoke.txt

  latency-gate:
    name: Ubuntu Release Latency Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The p99 thresholds in tests/BenchmarkRegression.cpp are calibrated for
      # an optimized x86 Release build, and CMake only defines
      # OB_ENFORCE_LATENCY_THRESHOLD for Release-without-fault-injection. Until
      # this lane existed no workflow met that description: ci.yml ran macOS
      # Release plus Ubuntu Debug/ASan and Ubuntu TSan Debug, every one of them
      # excluding BenchmarkRegressionTest, and benchmark-gate.yml builds Ubuntu
      # Release with -DBUILD_TESTS=OFF. The gate compiled, skipped itself, and
      # enforced nothing anywhere.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_SANITIZERS=OFF
          -DENABLE_FAULT_INJECTION=OFF
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Enforce p99 latency thresholds
        # ONLY this label, and never under -j: the thresholds are calibrated
        # single-threaded and uncontended, so running alongside the rest of the
        # suite inflates p99 and false-fails (the target already sets
        # RUN_SERIAL, this keeps the lane honest end to end).
        #
        # until-pass:2 because a p99 on a shared runner is a statistical
        # measurement, and one noisy-neighbour spike is not a regression. A
        # real regression is reproducible and fails both attempts. Without the
        # retry this lane flakes, and a flaky gate gets switched off again —
        # which is how it became a dead letter the first time.
        run: ctest --test-dir build --output-on-failure -L benchmark-regression --repeat until-pass:2

  fault-injection:
    name: Ubuntu Fault Injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_FAULT_INJECTION=ON
          -DBUILD_TESTS=ON
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Full suite with fault-injection points compiled in (OB_ENABLE_FAULT_INJECTION).
        # Without this lane, the hostile-queue regressions are vacuous passes:
        # QueueChaosTest main() returns 0 with a printed notice when the macro is
        # undefined, and MpscQueue's shouldFail() hooks compile to constexpr-false.
        # QueueChaosTest arms queue.push.spurious_fail / queue.pop.spurious_empty
        # and asserts no lost/duplicated orders under 50-95% injected push failures.
        # Exclusions documented:
        #   BenchmarkRegressionTest — perf-only; FI adds per-push/pop overhead,
        #                             so its thresholds are meaningless here
        run: ctest --test-dir build --output-on-failure -L project -E 'BenchmarkRegressionTest'
