\* TLC config for MatchingEngine.tla at a depth MatchingEngine.cfg cannot
\* reach, run by .github/workflows/tla.yml on every push. Counts from the
\* last run are in docs/Verification.md.
\*
\* At MatchingEngine.cfg three orders can rest at one level, but then no
\* fourth order is left to trade against them, so a fill never takes an
\* order with two or more behind it. Here four orders at one price let
\* three rest and a fourth hit them: a fill of the front with two behind,
\* a 3-lot sweep through the whole level, a partial fill in the middle of
\* a queue, cancels, modifies and a replace to the back with orders on both
\* sides of it. Price priority across levels is MatchingEngine.cfg's job.
\* MatchingEngineDeepBrokenSwap.cfg must fail here and passes there.

SPECIFICATION Spec

CONSTANTS
    MaxOrders = 4
    MaxReplaces = 1
    Participants = {1, 2}
    Prices = {100}
    MaxQty = 3
    BUG = "none"

INVARIANTS
    NoNegativeQuantity
    NoEmptyRestingOrder
    FIFO_Preservation
    MatchingConservation
    NoCrossedBookAfterStep
    NoSelfTrade

PROPERTIES
    PricePriority
    FIFOExecution
    ExecPriceIsPassive
